apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}-server
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: {{ include "app.image" (dict "Values" .Values "component" "server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
          env:
            # Czytane wprost z os.environ przez marketdata/sec.py, nie przez pydantic-settings.
            - name: SEC_USER_AGENT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.key }}
                  optional: true
            - name: SUWALSKI_MARKET_CACHE
              value: /var/cache/suwalski-market
          volumeMounts:
            - name: cache
              mountPath: /var/cache/suwalski-market
          # /health nie dotyka sieci zewnętrznej, więc nadaje się na sondę.
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        - name: cache
          {{- if .Values.cache.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "app.name" . }}-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.name" . }}-server
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  # ClusterIP: widoczne tylko wewnątrz klastra. Z zewnątrz i tak wchodzi się przez web,
  # który proxuje /api — tak samo jak w compose.
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
