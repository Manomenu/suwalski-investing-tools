{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # Przeglądarka idzie tylko do web. Ruch na /api rozstrzyga nginx wewnątrz tego poda —
    # jedna reguła zamiast dwóch, a przeglądarka widzi jeden origin, więc CORS nie wchodzi do gry.
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "app.name" . }}-web
                port:
                  number: 80
    {{- with .Values.ingress.mcpHost }}
    # Asystent idzie prosto do serwera: MCP to nie przeglądarka, origin go nie dotyczy.
    - host: {{ . }}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "app.name" $ }}-server
                port:
                  number: {{ $.Values.server.port }}
    {{- end }}
{{- end }}
