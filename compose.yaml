# The local stand-in for the cluster. Same images, wired the way the ingress wires them: the
# browser only ever talks to web, and /api is proxied on to server.
#
#   just up                                  ->  http://localhost:8094
#   podman compose run --rm signals run      ->  one run of the signals job against this stack
#
# This is a verification harness, not the deployment: the whole stack runs on a laptop
# without the cluster. The cluster gets the same images from the registry (deploy/chart).
# A service the app gains is added here AND in the chart, together.

services:
  server:
    build:
      context: .
      dockerfile: suwinvtools_server/Dockerfile
    # Machine-local settings — SEC_USER_AGENT, the webhooks, the model — come from the same root
    # .env the host uses. In the cluster they arrive as Secrets instead.
    env_file:
      - path: .env
        required: false
    environment:
      # After env_file on purpose: a host address from .env must not leak into the container.
      DATABASE_URL: postgresql://suwinvtools:suwinvtools@postgres:5432/suwinvtools
      SUWINVTOOLS_MARKET_CACHE: /var/cache/suwinvtools-market
      WEB_BASE: http://localhost:8094
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6240/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  # The monthly job: the server's image with another command, as the cluster's CronJob runs
  # it. A job, not a service — the `jobs` profile keeps `just up` from starting it.
  signals:
    profiles: [jobs]
    build:
      context: .
      dockerfile: suwinvtools_server/Dockerfile
    entrypoint: ["python", "-m", "suwinvtools_server.signals.job"]
    command: ["run", "--dry-run"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://suwinvtools:suwinvtools@postgres:5432/suwinvtools
      SUWINVTOOLS_MARKET_CACHE: /var/cache/suwinvtools-market
      WEB_BASE: http://localhost:8094
    depends_on:
      postgres:
        condition: service_healthy

  # A volume of its own, apart from the one `just db up` uses, so the stack and the
  # development server never share data. No published port: only the server reaches it.
  postgres:
    image: docker.io/library/postgres:17.11
    environment:
      POSTGRES_USER: suwinvtools
      POSTGRES_PASSWORD: suwinvtools
      POSTGRES_DB: suwinvtools
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "suwinvtools", "-d", "suwinvtools"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: suwinvtools_web/Dockerfile
    environment:
      API_UPSTREAM: http://server:6240
    ports:
      - "8094:8080"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres:
