[project]
name = "suwalski-investing-server"
version = "0.1.0"
description = "HTTP API over the suwalski valuation engine"
requires-python = ">=3.12,<3.15"
dependencies = [
    "suwalski-investing-library[tickers]",  # engine, contracts and ticker snapshots (path via uv.sources)
    "fastapi>=0.115",              # HTTP API + OpenAPI schema for the future dashboard
    "pydantic-settings>=2.6",      # settings loaded from the layered .env files
    "uvicorn[standard]>=0.30",     # ASGI server
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
suwalski-investing-library = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["suwalski_investing_server"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # required by fastapi.testclient
]
